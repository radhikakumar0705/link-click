name: CI / CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/link-click

jobs:
  # ── 1. Lint & Type Check ──────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: |
          npm run lint
          npx prettier --check '**/*.{ts,tsx,json}' --ignore-path .gitignore

      - name: Type check
        run: npm run type-check

  # ── 2. Unit & Integration Tests ───────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: linkclick_test
          POSTGRES_USER: linkclick
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgresql://linkclick:test_password@localhost:5432/linkclick_test
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_TEST }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_TEST }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations (test DB)
        run: npx prisma migrate deploy --schema=migrations/schema.prisma

      - name: Run tests
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── 3. Build Docker images ────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    # Only build on push to main or on version tags — not on PRs
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [write-service, redirect-service, analytics-service, kafka-consumer]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Build Chrome Extension ─────────────────────────────────────────────────
  build-extension:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build -w extension

      - name: Package extension zip
        run: |
          cd extension/dist
          zip -r ../../link-click-extension-${{ github.ref_name }}.zip .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: link-click-extension-${{ github.ref_name }}
          path: link-click-extension-*.zip
          retention-days: 30

  # ── 5. Deploy to Staging ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, build-extension]
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run DB migrations on staging
        run: |
          npx prisma migrate deploy --schema=migrations/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Deploy to ECS (staging)
        run: |
          for SERVICE in write-service redirect-service analytics-service kafka-consumer; do
            aws ecs update-service \
              --cluster link-click-staging \
              --service $SERVICE \
              --force-new-deployment \
              --region us-east-1
          done

      - name: Wait for services to stabilise
        run: |
          for SERVICE in write-service redirect-service analytics-service kafka-consumer; do
            aws ecs wait services-stable \
              --cluster link-click-staging \
              --services $SERVICE \
              --region us-east-1
          done

  # ── 6. Deploy to Production (canary) ─────────────────────────────────────────
  deploy-production:
    name: Deploy to Production (canary)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1

      - name: Run DB migrations on production
        run: npx prisma migrate deploy --schema=migrations/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Deploy redirect-service first (most critical path)
        run: |
          aws ecs update-service \
            --cluster link-click-prod \
            --service redirect-service \
            --force-new-deployment \
            --region us-east-1
          aws ecs wait services-stable \
            --cluster link-click-prod \
            --services redirect-service \
            --region us-east-1

      - name: Canary health check (10 min window)
        run: |
          echo "Monitoring error rate for 10 minutes..."
          sleep 600
          # In a real pipeline, query CloudWatch/Grafana for error rate
          # and fail this step if > 1% to trigger automatic rollback

      - name: Deploy remaining services
        run: |
          for SERVICE in write-service analytics-service kafka-consumer; do
            aws ecs update-service \
              --cluster link-click-prod \
              --service $SERVICE \
              --force-new-deployment \
              --region us-east-1
          done
